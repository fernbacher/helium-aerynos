name        : helium-bin
version     : "0.18.3.1"
release     : 9
homepage    : https://helium.computer/
upstreams   :
    - https://github.com/imputnet/helium-linux/releases/download/0.18.3.1/helium-0.18.3.1-x86_64_linux.tar.xz:
        hash: 89bd962ca5e5159916a4c4befa5a9a08f540d2d8cd794f2f955e8d5d4a463bf2
    - https://raw.githubusercontent.com/imputnet/helium-linux/0.18.3.1/package/net.imput.helium.metainfo.xml:
        hash: 3c6760335eacac20c8a64d12d3e0785d48b6ef08f330a9c5833197651dd5b8f2
        unpack: false
        rename: net.imput.helium.metainfo.xml
summary     : Private, fast, and honest web browser
description : |
    Helium is a private, fast, and honest Chromium-based web browser.
    This package repackages Helium's signed upstream Linux binary release.
license     :
    - BSD-3-Clause
    - GPL-3.0-only
rundeps     :
    - ca-certificates
    - liberation-fonts-ttf
    - vulkan-loader
    - xdg-utils
rundeps-exclude:
    # These shims are optional desktop integrations selected at runtime.
    - 'soname\(libQt5.*\.so.*\)'
    - 'soname\(libQt6.*\.so.*\)'
debug       : false
strip       : false
install     : |
    helium_dir="%(installroot)%(libdir)/helium"

    %install_dir "$helium_dir"
    cp -a . "$helium_dir/"

    # The upstream profile targets /opt and AerynOS does not ship AppArmor.
    rm -v "$helium_dir/apparmor.cfg"

    sed -Ei 's/(CHROME_VERSION_EXTRA=).*/\1"AerynOS (moss)"/' \
        "$helium_dir/helium-wrapper"

    %install_file helium.desktop \
        "%(installroot)%(datadir)/applications/helium.desktop"
    %install_file product_logo_256.png \
        "%(installroot)%(datadir)/icons/hicolor/256x256/apps/helium.png"
    %install_file "%(sourcedir)/net.imput.helium.metainfo.xml" \
        "%(installroot)%(datadir)/metainfo/net.imput.helium.metainfo.xml"

    %install_dir "%(installroot)%(bindir)"
    ln -srv "$helium_dir/helium-wrapper" \
        "%(installroot)%(bindir)/helium"
